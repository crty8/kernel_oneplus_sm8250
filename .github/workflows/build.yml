name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove Missing Kali Drivers
        run: |
          sed -i '/rtl8814/Id' drivers/staging/Kconfig drivers/staging/Makefile || true
          sed -i '/rtl8192/Id' drivers/staging/Kconfig drivers/staging/Makefile || true
          sed -i '/rtl8188/Id' drivers/staging/Kconfig drivers/staging/Makefile || true
          sed -i '/rtl8150/Id' drivers/staging/Kconfig drivers/staging/Makefile || true
          sed -i '/rtl8187/Id' drivers/staging/Kconfig drivers/staging/Makefile || true
          sed -i '/rtl88x2/Id' drivers/staging/Kconfig drivers/staging/Makefile || true
          sed -i '/rtl8812au/Id' drivers/staging/Kconfig drivers/staging/Makefile || true

      - name: Inject RTL8821CU Driver
        run: |
          rm -rf drivers/staging/rtl8821cu
          git clone --depth=1 https://github.com/morrownr/8821cu-20210916.git drivers/staging/rtl8821cu
          
          # Fix Clang compiler errors by stripping out unsupported GCC flags
          sed -i 's/-Wno-enum-int-mismatch//g' drivers/staging/rtl8821cu/Makefile
          sed -i 's/-Wno-stringop-overread//g' drivers/staging/rtl8821cu/Makefile
          
          echo 'source "drivers/staging/rtl8821cu/Kconfig"' >> drivers/staging/Kconfig
          echo 'obj-$(CONFIG_RTL8821CU) += rtl8821cu/' >> drivers/staging/Makefile
          echo "CONFIG_RTL8821CU=y" >> arch/arm64/configs/vendor/kona-perf_defconfig

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev git zip lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

      - name: Compile Kernel Image
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- vendor/kona-perf_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Automating the manual AnyKernel3 fixes you did earlier!
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AK3/anykernel.sh
          sed -i 's/block=.*/BLOCK=boot;/g' AK3/anykernel.sh
          sed -i 's/is_slot_device=0;/IS_SLOT_DEVICE=1;/g' AK3/anykernel.sh
          sed -i '/# init.rc/,$d' AK3/anykernel.sh
          echo "dump_boot;" >> AK3/anykernel.sh
          echo "write_boot;" >> AK3/anykernel.sh
          
          cp out/arch/arm64/boot/Image AK3/
          cd AK3
          zip -r9 ../AnyKernel3-ViP3R-kebab.zip * -x .git README.md

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ViP3R-kebab
          path: AnyKernel3-ViP3R-kebab.zip
